services:
  mongo:
    image: mongo:6.0.13
    restart: unless-stopped
    tmpfs:
      - /data/db

  suite:
    image: ${SUITE_IMAGE:-lanyard-conformance-suite:release-v5.1.39}
    restart: unless-stopped
    environment:
      BASE_URL: https://suite.test
      MONGODB_HOST: mongo
      JAVA_EXTRA_ARGS: -Dfintechlabs.devmode=true
      OIDC_GOOGLE_CLIENTID: local-dev
      OIDC_GOOGLE_SECRET: local-dev
      OIDC_GITLAB_CLIENTID: local-dev
      OIDC_GITLAB_SECRET: local-dev
    depends_on:
      - mongo

  rp:
    image: golang:1.25
    restart: unless-stopped
    working_dir: /workspace
    command: ["go", "run", "./cmd/example-rp"]
    volumes:
      - ..:/workspace

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
