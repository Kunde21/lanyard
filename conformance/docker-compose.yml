services:
  mongo:
    build:
      context: ..
      dockerfile: conformance/images/mongo/Dockerfile
    image: lanyard-conformance-mongo:6.0.13
    restart: unless-stopped
    tmpfs:
      - /data/db

  suite:
    build:
      context: ..
      dockerfile: conformance/images/suite/Dockerfile
      args:
        SUITE_BASE_IMAGE: ${SUITE_IMAGE:-lanyard-conformance-suite:release-v5.1.39}
    image: ${SUITE_RUNTIME_IMAGE:-lanyard-conformance-suite-with-ca:release-v5.1.39}
    restart: unless-stopped
    environment:
      BASE_URL: https://suite.localhost
      BASE_MTLS_URL: https://suite.localhost:8444
      MONGODB_HOST: mongo
      JAVA_EXTRA_ARGS: -Dfintechlabs.devmode=true
      OIDC_GOOGLE_CLIENTID: local-dev
      OIDC_GOOGLE_SECRET: local-dev
      OIDC_GITLAB_CLIENTID: local-dev
      OIDC_GITLAB_SECRET: local-dev
    depends_on:
      - mongo

  rp:
    build:
      context: ..
      dockerfile: conformance/images/rp/Dockerfile
    image: lanyard-conformance-rp:1.25
    restart: unless-stopped
    working_dir: /workspace
    command: ["/workspace/example-rp"]
    environment:
      RP_INSECURE_TLS: ${RP_INSECURE_TLS:-false}
      RP_ISSUER: ${RP_ISSUER:-https://suite.localhost/test/a/lanyard-local/}
      RP_CONFORMANCE_FRESH_DISCOVERY: ${RP_CONFORMANCE_FRESH_DISCOVERY:-true}
    volumes:
      - ..:/workspace

  caddy:
    build:
      context: ..
      dockerfile: conformance/images/caddy/Dockerfile
    image: lanyard-conformance-caddy:2.10.2
    restart: unless-stopped
    ports:
      - "443:443"
      - "8444:8444"
    networks:
      default:
        aliases:
          - suite.localhost
          - rp.localhost
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
