name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.11.0
      - name: Test format gate
        run: bash .github/scripts/check-gofumpt_test.sh
      - name: Format
        run: bash .github/scripts/check-gofumpt.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Build
        run: go build ./...
